server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Security headers (the page only loads its own scripts; no third-party CDNs)
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'self'; frame-ancestors 'self'; base-uri 'none'; form-action 'self'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options SAMEORIGIN always;

  # Never serve dotfiles
  location ~ /\. { return 404; }

  # Report data changes after every run: don't cache it
  location /reports/ {
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'none'; object-src 'self'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # "Generate report" button -> n8n webhook, same-origin so no CORS or extra ports are needed.
  # The variable + resolver lets nginx start even if n8n is still booting.
  location = /api/generate {
    limit_except POST { deny all; }
    resolver 127.0.0.11 valid=30s;
    set $n8n http://n8n:5678;
    proxy_pass $n8n/webhook/generate-report;
    proxy_set_header Host localhost;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    client_max_body_size 4k;
  }
}
